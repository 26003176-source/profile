<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro</title>
  <style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.video-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 9999;
  background: black;
}

#intro-video {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

  </style>
</head>
<body>
  <div class="video-container">
    <video id="intro-video" autoplay muted playsinline preload="auto">
      <source src="./video/tiktok1.mp4" type="video/mp4">
      Trình duyệt không hỗ trợ video.
    </video>
  </div>

  <script>
    const video = document.getElementById("intro-video");

    // Chuyển sang index.html sau khi video chạy xong
    video.addEventListener("ended", () => {
      window.location.href = "index.html";
    });

    // Bật tiếng sau khi người dùng tương tác
    const enableSound = () => {
      video.muted = false;
      video.volume = 1;
      video.play();
      document.removeEventListener("click", enableSound);
      document.removeEventListener("touchstart", enableSound);
    };

    document.addEventListener("click", enableSound);
    document.addEventListener("touchstart", enableSound);
  </script>
</body>
</html>
